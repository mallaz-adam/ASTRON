<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 172" class="lesson-art lesson-03-fuel" role="img" aria-label="A picture to help think, not a real container. A heavier star has a big store of fuel and uses it fast. A lighter star has a smaller store and uses it slowly" font-family="IM Fell English, Georgia, serif"><rect width="318" height="172" fill="#1E2D52"/><rect x="5" y="5" width="308" height="162" fill="none" stroke="#C9A44A" stroke-opacity="0.6" stroke-dasharray="1 6"/><g fill="none" stroke="#E9DBBB" stroke-width="1.5"><rect x="46" y="26" width="60" height="100" rx="4"/><rect x="214" y="66" width="40" height="60" rx="4"/></g><rect class="fuel" x="48" y="28" width="56" height="96" rx="3" fill="#E8C46A" fill-opacity="0.85"/><rect class="fuel" x="216" y="68" width="36" height="56" rx="3" fill="#E8C46A" fill-opacity="0.85"/><path d="M110 76h46l-10-10M156 76l-10 10" fill="none" stroke="#E9DBBB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 96h30l-6-6M288 96l-6 6" fill="none" stroke="#E9DBBB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="18" text-anchor="middle" font-size="14" fill="#E9DBBB" fill-opacity="1" font-style="italic">heavier star</text><text x="234" y="58" text-anchor="middle" font-size="14" fill="#E9DBBB" fill-opacity="1" font-style="italic">lighter star</text><text x="76" y="146" text-anchor="middle" font-size="13" fill="#E9DBBB" fill-opacity="0.85" font-style="italic">more fuel</text><text x="76" y="162" text-anchor="middle" font-size="12" fill="#E9DBBB" fill-opacity="0.7" font-style="italic">used fast</text><text x="234" y="146" text-anchor="middle" font-size="13" fill="#E9DBBB" fill-opacity="0.85" font-style="italic">less fuel</text><text x="234" y="162" text-anchor="middle" font-size="12" fill="#E9DBBB" fill-opacity="0.7" font-style="italic">used slowly</text></svg>
