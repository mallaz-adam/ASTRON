<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 150" class="lesson-art lesson-03-colours" role="img" aria-label="A blue star and a red star of the same size. The blue star has the hotter surface and the red star the cooler one" font-family="IM Fell English, Georgia, serif"><rect width="318" height="150" fill="#1E2D52"/><rect x="5" y="5" width="308" height="140" fill="none" stroke="#C9A44A" stroke-opacity="0.6" stroke-dasharray="1 6"/><circle cx="90" cy="62" r="40" fill="#A9C4EE" fill-opacity="0.18"/><circle class="star-disc" cx="90" cy="62" r="30" fill="#A9C4EE" stroke="#2A1C13" stroke-opacity="0.5" stroke-width="1"/><circle cx="228" cy="62" r="40" fill="#D9735A" fill-opacity="0.18"/><circle class="star-disc" cx="228" cy="62" r="30" fill="#D9735A" stroke="#2A1C13" stroke-opacity="0.5" stroke-width="1"/><text x="90" y="120" text-anchor="middle" font-size="15" fill="#E9DBBB" fill-opacity="1" font-style="italic">blue star</text><text x="90" y="138" text-anchor="middle" font-size="12" fill="#E9DBBB" fill-opacity="0.75" font-style="italic">hotter surface</text><text x="228" y="120" text-anchor="middle" font-size="15" fill="#E9DBBB" fill-opacity="1" font-style="italic">red star</text><text x="228" y="138" text-anchor="middle" font-size="12" fill="#E9DBBB" fill-opacity="0.75" font-style="italic">cooler surface</text></svg>
